# Meson cross file for the browser (WebAssembly + WebGL 2) build.
# Requires the Emscripten SDK on PATH (run emsdk_env first), then:
#   meson setup buildWeb --cross-file web/emscripten.ini
#   meson compile -C buildWeb
# Serve buildWeb/ over HTTP (e.g. `python -m http.server -d buildWeb`) and open myfirstmeson.html.
[binaries]
c = 'emcc'
cpp = 'em++'
ar = 'emar'
strip = 'emstrip'

[built-in options]
default_library = 'static'
buildtype = 'release'

[host_machine]
system = 'emscripten'
cpu_family = 'wasm32'
cpu = 'wasm32'
endian = 'little'
