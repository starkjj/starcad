<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StarCAD</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #212830; }
    #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; outline: none; }
    #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
               color: #9aa6b5; font: 14px system-ui, sans-serif; }
  </style>
</head>
<body>
  <div id="loading">Loading StarCAD&hellip;</div>
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <script>
    var Module = {
      canvas: document.getElementById('canvas'),
      onRuntimeInitialized: function () {
        document.getElementById('loading').remove();
        document.getElementById('canvas').focus();
      },
      print: function (t) { console.log(t); },
      printErr: function (t) { console.error(t); }
    };
    // Keep keyboard focus on the canvas so typed commands reach the app
    document.addEventListener('mousedown', function () { document.getElementById('canvas').focus(); });
  </script>
  {{{ SCRIPT }}}
</body>
</html>
